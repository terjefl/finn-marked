name: tester, lint og image

# Sjekkene kjører FØR image-bygget: tidligere kunne et ødelagt image bli bygget og
# publisert uten at noe stoppet det. På pull requests kjøres bare sjekkene.

on:
  push:
    branches: ['**']          # sjekkene på alle grener; image bygges bare fra main (se under)
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

jobs:
  sjekk:
    name: tester og lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: installer
        run: pip install -r requirements-dev.txt
      - name: lint
        run: ruff check .
      - name: tester
        run: |
          python tests/test_parser.py
          python tests/test_innsamling.py
          python tests/test_auksjonen.py
          python tests/test_sok.py
          python tests/test_auth.py

  bygg:
    needs: sjekk
    # Image bygges og pushes bare fra main — en gren skal kunne testes i CI uten
    # å overskrive :latest.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: logg inn på ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: bygg og push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
