# Kjører tjenesten lokalt/ på en vert uten Portainer. I Portainer brukes
# DOCKERSRV1/finn-marked/compose.yml i Docker-repoet (samme image, egne volumer).
services:
  finn-marked:
    image: ghcr.io/terjefl/finn-marked:latest
    container_name: finn-marked
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
      - FINN_DATA=/data
      # Passkeys: RP-id og origin må være adressen brukerne faktisk åpner.
      - FINN_RP_ID=bilmarked.flagan.net
      - FINN_ORIGIN=https://bilmarked.flagan.net
      # Valgfri: åpner /oppsett?nokkel=… for å gi en admin ny passkey (gjenoppretting).
      # - FINN_OPPSETT_NOKKEL=
      # Statens vegvesen (egen bil fra registreringsnummer). Bestilles på vegvesen.no.
      # - FINN_SVV_NOKKEL=
      # Varsling: e-post via SMTP (587 = STARTTLS, 465 = SSL) og valgfritt Pushover (app-token).
      # - FINN_SMTP_HOST=smtp.eksempel.no
      # - FINN_SMTP_PORT=587
      # - FINN_SMTP_BRUKER=
      # - FINN_SMTP_PASSORD=
      # - FINN_SMTP_FRA=finn-marked@eksempel.no
      # - FINN_PUSHOVER_TOKEN=
      # - FINN_BASE_URL=https://bilmarked.flagan.net
    ports:
      - "8099:8000"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
