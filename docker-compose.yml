# Kjører tjenesten lokalt/ på en vert uten Portainer. I Portainer brukes
# DOCKERSRV1/finn-marked/compose.yml i Docker-repoet (samme image, egne volumer).
services:
  finn-marked:
    image: ghcr.io/terjefl/finn-marked:latest
    container_name: finn-marked
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
      - FINN_DATA=/data
      # Passkeys: RP-id og origin må være adressen brukerne faktisk åpner.
      - FINN_RP_ID=bilmarked.flagan.net
      - FINN_ORIGIN=https://bilmarked.flagan.net
      # Valgfri: åpner /oppsett?nokkel=… for å gi en admin ny passkey (gjenoppretting).
      # - FINN_OPPSETT_NOKKEL=
    ports:
      - "8099:8000"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
